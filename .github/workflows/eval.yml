name: eval

on:
  push:
  pull_request:
  # The paid gate runs only on a manual start: about $0.73 a run, and it downloads the example's blog posts again.
  # Start it when the example's prompt, retriever, or model changes.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: General flow (free, no secrets)
        run: uv run python test_general.py
      - name: Case study checks (free, no secrets)
        working-directory: examples/hamel-blog
        run: for t in test_slice*.py; do uv run python "$t"; done

  gate:
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    # Traces hold the blog's copyrighted text, so they are never uploaded as an artifact; the log has the report.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Download the case study corpus
        working-directory: examples/hamel-blog
        run: uv run python -m hamel.corpus
      - name: Answer the 109 synthetic questions with the reference RAG (about $0.70)
        working-directory: examples/hamel-blog
        run: uv run python -m hamel.contract answer --run ci
      - name: Judge the answers with Jev (about $0.03)
        working-directory: examples/hamel-blog/workspace
        run: uv run rag-eval scan --run ci
      - name: Gate on faithfulness and declines
        working-directory: examples/hamel-blog/workspace
        run: uv run rag-eval gate --run ci
